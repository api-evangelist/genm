aid: genm
name: GenM
description: GenM (now operating as Acadium) is a digital marketing career and apprenticeship
  platform that connects emerging marketers with mentors and businesses. The platform offers
  free digital marketing courses (SEO, social media, email, and content marketing), hands-on
  MicroTasks for portfolio building, three-month remote apprenticeships, and Acadium Plus, an
  eight-week program that leads to full-time hiring. Businesses use Acadium to crowdsource
  marketing work and mentor emerging talent while growing their operations. GenM was surfaced as
  a portfolio company of 500 Global and added to the API Evangelist network for enrichment; the
  company operates a consumer/business web application at app.acadium.com and publishes no public
  developer API surface.
